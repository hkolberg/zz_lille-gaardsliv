<script>
const C=document.getElementById('game'),X=C.getContext('2d'),label=document.getElementById('place'),desc=document.getElementById('desc');let W,H,D=1,cam={x:0,y:0,z:1},touch=new Map(),pinch=0,moved=false;const TW=64,TH=32,OX=1024,OY=75,N=27,M=23;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);C.width=W*D;C.height=H*D;X.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();const hash=(a,b,s=0)=>{let n=Math.sin(a*127.1+b*311.7+s*73.3)*43758.5453;return n-Math.floor(n)};const height=(a,b)=>{let h=0;if(a<5&&b<9)h=1;if(a<3&&b<6)h=2;if(a>7&&a<20&&b>3&&b<18)h=1;if(a>10&&a<18&&b>6&&b<15)h=2;return h},water=(a,b)=>a+b>39||a>24&&b>11;function iso(a,b,z=0){return{x:OX+(a-b)*TW/2,y:OY+(a+b)*TH/2-z*18}}
function path(p,f,s='#3a2c1f55',w=1){X.beginPath();X.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)X.lineTo(p[i].x,p[i].y);X.closePath();if(f){X.fillStyle=f;X.fill()}if(s){X.strokeStyle=s;X.lineWidth=w;X.stroke()}}function diamond(a,b,col,z=height(a,b)){let p=iso(a,b,z),u=TW/2,v=TH/2;path([{x:p.x,y:p.y-v},{x:p.x+u,y:p.y},{x:p.x,y:p.y+v},{x:p.x-u,y:p.y}],col);if(z&&!water(a,b)){path([{x:p.x-u,y:p.y},{x:p.x,y:p.y+v},{x:p.x,y:p.y+v+18},{x:p.x-u,y:p.y+18}],'#527536');path([{x:p.x+u,y:p.y},{x:p.x,y:p.y+v},{x:p.x,y:p.y+v+18},{x:p.x+u,y:p.y+18}],'#41632f')}}
function grass(a,b){let z=height(a,b),p=iso(a,b,z),cols=['#71a548','#78ad4c','#6b9c43'];diamond(a,b,cols[(a+b*3)%3],z);X.fillStyle='#b3ce6d';for(let i=0;i<3;i++){let dx=(hash(a,b,i)-.5)*40,dy=(hash(b,a,i+4)-.5)*13;X.fillRect(Math.round(p.x+dx),Math.round(p.y+dy),2,3)}}function road(a,b){let p=iso(a,b,height(a,b));diamond(a,b,(a+b)%2?'#bd9b63':'#c7a56b');X.fillStyle='#78614255';for(let i=0;i<7;i++)X.fillRect(p.x-23+i*8,p.y+(i%3)-2,3,2)}function field(a,b){let p=iso(a,b,height(a,b));diamond(a,b,(a+b)%2?'#b98d31':'#c69c39');for(let i=-23;i<25;i+=7){X.strokeStyle=i%2?'#f1d064':'#e0ba47';X.lineWidth=2;X.beginPath();X.moveTo(p.x+i-7,p.y+10);X.lineTo(p.x+i+9,p.y-9);X.stroke()}}
function tree(a,b,s=.8){let p=iso(a,b,height(a,b)),y=p.y-4;X.fillStyle='#35291b';X.fillRect(p.x-3*s,y-17*s,6*s,22*s);for(const [dx,dy,r,c] of [[-8,-25,13,'#24522b'],[8,-26,14,'#2e6732'],[0,-38,15,'#39783a'],[-5,-47,10,'#4b8840']]){X.fillStyle=c;X.beginPath();X.arc(p.x+dx*s,y+dy*s,r*s,0,7);X.fill()}X.fillStyle='#91b75a99';X.fillRect(p.x-8*s,y-45*s,7*s,5*s)}function rock(a,b,s=.8){let p=iso(a,b,height(a,b));path([{x:p.x-12*s,y:p.y+4},{x:p.x-8*s,y:p.y-10*s},{x:p.x+1*s,y:p.y-18*s},{x:p.x+13*s,y:p.y-4*s},{x:p.x+9*s,y:p.y+6}],'#77766d');path([{x:p.x-8*s,y:p.y-10*s},{x:p.x+1*s,y:p.y-18*s},{x:p.x+4*s,y:p.y-6*s}],'#b7af97',null)}
function shadow(p,w,h=16){X.fillStyle='#15200f44';X.beginPath();X.ellipse(p.x+5,p.y+5,w,h,0,0,7);X.fill()}function wall(p,w,h,c='#dfc998'){X.fillStyle=c;X.fillRect(p.x-w/2,p.y-h,w,h);X.strokeStyle='#563920';X.lineWidth=5;X.strokeRect(p.x-w/2+2,p.y-h+2,w-4,h-3);for(let i=-w/2+20;i<w/2;i+=23){X.beginPath();X.moveTo(p.x+i,p.y-h);X.lineTo(p.x+i,p.y);X.stroke()}X.lineWidth=3;X.beginPath();X.moveTo(p.x-w/2+4,p.y-h+4);X.lineTo(p.x-3,p.y-3);X.moveTo(p.x+w/2-4,p.y-h+4);X.lineTo(p.x+3,p.y-3);X.stroke()}function roof(p,w,h,c='#9b4731'){path([{x:p.x-w/2-10,y:p.y-h+3},{x:p.x-12,y:p.y-h-38},{x:p.x+w/2+11,y:p.y-h+3}],c,'#4a2c20',3);X.strokeStyle='#c97049';X.lineWidth=2;for(let y=p.y-h-29;y<p.y-h+1;y+=7){X.beginPath();X.moveTo(p.x-w/2,y);X.lineTo(p.x+w/2,y+12);X.stroke()}}function details(p,h){X.fillStyle='#49301e';X.fillRect(p.x-9,p.y-31,18,31);X.fillStyle='#dbb052';X.fillRect(p.x+4,p.y-17,3,3);for(const dx of [-31,23]){X.fillStyle='#79a8ac';X.fillRect(p.x+dx,p.y-h+24,13,13);X.strokeStyle='#4b3826';X.lineWidth=2;X.strokeRect(p.x+dx,p.y-h+24,13,13)}}
function farmhouse(a,b){let p=iso(a,b,height(a,b)),w=108,h=61;shadow(p,65,18);wall(p,w,h);roof(p,w,h,'#a44831');details(p,h);X.fillStyle='#6c665b';X.fillRect(p.x-31,p.y-h-43,12,33);X.fillStyle='#aaa18b';X.fillRect(p.x-33,p.y-h-45,16,7);X.fillStyle='#70482a';X.fillRect(p.x-w/2-13,p.y-30,16,30)}function cottage(a,b,c='#804331'){let p=iso(a,b,height(a,b)),w=72,h=43;shadow(p,44,13);wall(p,w,h,'#d8c28e');roof(p,w,h,c);details(p,h)}function barn(a,b){let p=iso(a,b,height(a,b)),w=94,h=55;shadow(p,55);X.fillStyle='#954733';X.fillRect(p.x-w/2,p.y-h,w,h);X.strokeStyle='#5b3224';X.lineWidth=5;X.strokeRect(p.x-w/2+2,p.y-h+2,w-4,h-3);path([{x:p.x-w/2-8,y:p.y-h+2},{x:p.x,y:p.y-h-43},{x:p.x+w/2+8,y:p.y-h+2}],'#6f382b','#48291e',3);X.fillStyle='#432d1e';X.fillRect(p.x-16,p.y-34,32,34);X.strokeStyle='#d1a46b';X.lineWidth=3;X.beginPath();X.moveTo(p.x-15,p.y-33);X.lineTo(p.x+15,p.y-1);X.moveTo(p.x+15,p.y-33);X.lineTo(p.x-15,p.y-1);X.stroke()}
function mill(a,b,t){let p=iso(a,b,height(a,b));shadow(p,52);path([{x:p.x-34,y:p.y},{x:p.x-27,y:p.y-76},{x:p.x+27,y:p.y-76},{x:p.x+35,y:p.y}],'#d4cbb2','#5e5546',3);X.strokeStyle='#938a76';for(let y=p.y-9;y>p.y-72;y-=10){X.beginPath();X.moveTo(p.x-31,y);X.lineTo(p.x+31,y);X.stroke()}path([{x:p.x-32,y:p.y-73},{x:p.x,y:p.y-105},{x:p.x+32,y:p.y-73}],'#904631','#4b2a20',3);X.fillStyle='#4a3020';X.fillRect(p.x-8,p.y-31,16,31);X.beginPath();X.arc(p.x,p.y-79,9,0,7);X.fill();X.save();X.translate(p.x,p.y-79);X.rotate(t/5200);for(let k=0;k<4;k++){X.save();X.rotate(k*Math.PI/2);X.fillStyle='#533823';X.fillRect(-3,-8,6,-59);X.strokeStyle='#4a3120';X.lineWidth=3;X.strokeRect(-10,-65,20,58);X.strokeStyle='#e4dbc3';X.lineWidth=1;for(let y=-59;y<-10;y+=8){X.beginPath();X.moveTo(-8,y);X.lineTo(8,y);X.stroke()}X.restore()}X.restore()}
function well(a,b){let p=iso(a,b,height(a,b));shadow(p,23,8);X.fillStyle='#77776d';X.beginPath();X.ellipse(p.x,p.y,20,10,0,0,7);X.fill();X.fillStyle='#282f2a';X.beginPath();X.ellipse(p.x,p.y-3,13,6,0,0,7);X.fill();X.strokeStyle='#523720';X.lineWidth=4;X.beginPath();X.moveTo(p.x-15,p.y-4);X.lineTo(p.x-15,p.y-34);X.moveTo(p.x+15,p.y-4);X.lineTo(p.x+15,p.y-34);X.stroke();path([{x:p.x-23,y:p.y-32},{x:p.x,y:p.y-44},{x:p.x+23,y:p.y-32}],'#88422f','#4d2e20',2)}function villager(a,b,i,t){let p=iso(a,b,height(a,b));p.x+=Math.sin(t/1800+i*2)*7;p.y+=Math.sin(t/350+i)*1.5;X.fillStyle='#1d251a44';X.fillRect(p.x-5,p.y+1,11,4);X.fillStyle='#d2a36e';X.fillRect(p.x-3,p.y-18,7,7);X.fillStyle=['#315e82','#873f35','#d09a37','#496c36'][i%4];X.fillRect(p.x-5,p.y-11,10,11);X.fillStyle='#493426';X.fillRect(p.x-4,p.y-20,8,3)}function waterTile(a,b,t){let p=iso(a,b);diamond(a,b,(a+b)%2?'#3e8ea8':'#4599b0',0);X.strokeStyle='#b6e5df66';X.beginPath();X.moveTo(p.x-22+(t/1200+a+b)%1*5,p.y);X.quadraticCurveTo(p.x,p.y-5,p.x+22,p.y);X.stroke()}
function draw(t){X.setTransform(D,0,0,D,0,0);let sky=X.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#9ccad6');sky.addColorStop(.28,'#9bbf72');sky.addColorStop(1,'#365b35');X.fillStyle=sky;X.fillRect(0,0,W,H);X.save();X.translate(W/2+cam.x,H*.06+cam.y);X.scale(cam.z,cam.z);X.translate(-OX,-OY);for(let s=0;s<N+M;s++)for(let a=0;a<N;a++){let b=s-a;if(b<0||b>=M)continue;if(water(a,b))waterTile(a,b,t);else if((b===10&&a>3&&a<23)||(a===10&&b>5&&b<19)||(b===15&&a>8&&a<21))road(a,b);else if(a>=14&&a<=19&&b>=5&&b<=9)field(a,b);else grass(a,b)}let o=[];for(let i=0;i<62;i++){let a=.6+hash(i,2)*25,b=.6+hash(i,8)*21;if(!water(a,b)&&!((a>5&&a<22)&&(b>4&&b<18)))o.push({d:a+b,f:()=>tree(a,b,.62+hash(i,4)*.35)})}for(let i=0;i<20;i++){let a=1+hash(i,5)*24,b=1+hash(i,11)*20;if(!water(a,b)&&!(a>6&&a<21&&b>5&&b<17))o.push({d:a+b,f:()=>rock(a,b,.55+hash(i,1)*.5)})}o.push({d:15,f:()=>farmhouse(7,8)},{d:17,f:()=>barn(12,5)},{d:19,f:()=>cottage(7,12)},{d:23,f:()=>cottage(13,10,'#9b5035')},{d:27,f:()=>cottage(11,16,'#754331')},{d:27,f:()=>mill(19,8,t)},{d:21,f:()=>well(11,10)});for(let i=0;i<14;i++){let a=6+hash(i,15)*13,b=7+hash(i,20)*9;o.push({d:a+b+.5,f:()=>villager(a,b,i,t)})}o.sort((a,b)=>a.d-b.d).forEach(v=>v.f());X.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);
const hits=[{a:7,b:8,n:'Rønningsberg gård',d:'Våningshus · 5 beboere · nivå 2'},{a:12,b:5,n:'Den røde låven',d:'Lagrer korn, høy og redskaper'},{a:19,b:8,n:'Solvang mølle',d:'Maler 12 sekker korn hver dag'},{a:11,b:10,n:'Landsbybrønnen',d:'Friskt vann til hele bygda'}];function screen(a,b){let p=iso(a,b,height(a,b));return{x:(p.x-OX)*cam.z+W/2+cam.x,y:(p.y-OY)*cam.z+H*.06+cam.y}}C.onpointerdown=e=>{C.setPointerCapture(e.pointerId);touch.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false};C.onpointermove=e=>{if(!touch.has(e.pointerId))return;let old=touch.get(e.pointerId);touch.set(e.pointerId,{x:e.clientX,y:e.clientY});let a=[...touch.values()];if(a.length===1){let dx=e.clientX-old.x,dy=e.clientY-old.y;cam.x+=dx;cam.y+=dy;if(Math.abs(dx)+Math.abs(dy)>3)moved=true}else{let d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)cam.z=Math.max(.55,Math.min(1.75,cam.z*d/pinch));pinch=d;moved=true}};function up(e){let p=touch.get(e.pointerId);touch.delete(e.pointerId);pinch=0;if(!moved&&p){let best=null,dist=55;for(const h of hits){let s=screen(h.a,h.b),d=Math.hypot(p.x-s.x,p.y-s.y+30);if(d<dist){dist=d;best=h}}if(best){label.textContent=best.n;desc.textContent=best.d}}}C.onpointerup=up;C.onpointercancel=up;document.querySelectorAll('.tools button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tools button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
</script></body></html>
