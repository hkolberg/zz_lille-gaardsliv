<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17251b;font-family:Georgia,serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;z-index:3;color:#f6e8c5;background:linear-gradient(#4a351f,#281b11);border:3px solid #8c6538;box-shadow:0 3px 12px #0008,inset 0 0 0 1px #d4a65d;border-radius:6px}.top{top:max(7px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:8px 16px;font-weight:bold;white-space:nowrap}.title{top:max(7px,env(safe-area-inset-top));left:8px;padding:8px 12px;font-weight:bold}.tip{bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:7px 12px;font:12px -apple-system;white-space:nowrap}.badge{position:fixed;right:8px;top:max(7px,env(safe-area-inset-top));z-index:4;background:#efe0b8;color:#392817;border:2px solid #76522d;border-radius:5px;padding:7px 10px;font:bold 12px Georgia}</style></head><body><canvas id="g"></canvas><div class="hud title">Lille Gårdsliv</div><div class="hud top">🪙 1 240 &nbsp; 🪵 86 &nbsp; 🪨 42 &nbsp; 🌾 156</div><div class="badge">☀️ År 1 · Sommer</div><div class="hud tip">Grafikkdemo v0.4 · dra for å panorere · knip for å zoome</div>
<script>
const c=document.getElementById('g'),q=c.getContext('2d');let W,H,dpr,camX=0,camY=0,zoom=1;
function rs(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;q.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',rs);rs();
const TW=76,TH=38,OX=1100,OY=90;function iso(a,b,z=0){return{x:OX+(a-b)*TW/2,y:OY+(a+b)*TH/2-z}}
function poly(p,fill,stroke='#0002'){q.beginPath();q.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)q.lineTo(p[i].x,p[i].y);q.closePath();q.fillStyle=fill;q.fill();if(stroke){q.strokeStyle=stroke;q.lineWidth=1;q.stroke()}}
function tile(a,b,col){let p=iso(a,b),u=TW/2,v=TH/2;poly([{x:p.x,y:p.y-v},{x:p.x+u,y:p.y},{x:p.x,y:p.y+v},{x:p.x-u,y:p.y}],col)}
function rnd(a,b){let n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n)}
function tree(a,b,s=.9){let p=iso(a,b);q.fillStyle='#49351f';q.fillRect(p.x-3*s,p.y-3*s,6*s,23*s);let cs=['#1f572e','#2d6a34','#3e7b3b'];for(let i=0;i<3;i++){q.fillStyle=cs[i];q.beginPath();q.arc(p.x+(i-1)*7*s,p.y-(13+i*7)*s,15*s,0,7);q.fill()}q.fillStyle='#79a54b88';q.beginPath();q.arc(p.x-7*s,p.y-30*s,8*s,0,7);q.fill()}
function rock(a,b,s=1){let p=iso(a,b);poly([{x:p.x-13*s,y:p.y},{x:p.x-7*s,y:p.y-15*s},{x:p.x+4*s,y:p.y-22*s},{x:p.x+15*s,y:p.y-5*s},{x:p.x+9*s,y:p.y+5*s}], '#7d7b70');poly([{x:p.x-7*s,y:p.y-15*s},{x:p.x+4*s,y:p.y-22*s},{x:p.x+2*s,y:p.y-5*s}], '#b4ad96',null)}
function house(a,b,scale=1,red='#a74f35'){let p=iso(a,b),w=72*scale,h=46*scale,z=50*scale;q.fillStyle='#ead9ae';q.fillRect(p.x-w/2,p.y-z,w,h);q.strokeStyle='#62452c';q.lineWidth=5*scale;q.strokeRect(p.x-w/2+2,p.y-z+2,w-4,h-4);q.lineWidth=3*scale;for(let xx=-w/2+18;xx<w/2;xx+=22){q.beginPath();q.moveTo(p.x+xx,p.y-z);q.lineTo(p.x+xx,p.y-z+h);q.stroke()}poly([{x:p.x-w/2-8,y:p.y-z+2},{x:p.x,y:p.y-z-38*scale},{x:p.x+w/2+8,y:p.y-z+2}],red,'#5b3428');q.fillStyle='#51331f';q.fillRect(p.x-9*scale,p.y-z+21*scale,18*scale,25*scale);q.fillStyle='#88b6bd';q.fillRect(p.x-w/2+10,p.y-z+14,12,12)}
function barn(a,b){let p=iso(a,b);q.fillStyle='#a84e38';q.fillRect(p.x-48,p.y-62,96,60);q.strokeStyle='#713726';q.lineWidth=5;q.strokeRect(p.x-45,p.y-59,90,56);poly([{x:p.x-57,y:p.y-59},{x:p.x,y:p.y-108},{x:p.x+57,y:p.y-59}],'#7e3e30','#553025');q.fillStyle='#4d3020';q.fillRect(p.x-17,p.y-38,34,36);q.strokeStyle='#d4ad72';q.lineWidth=3;q.beginPath();q.moveTo(p.x-17,p.y-38);q.lineTo(p.x+17,p.y-2);q.moveTo(p.x+17,p.y-38);q.lineTo(p.x-17,p.y-2);q.stroke()}
function field(a,b,w,h){for(let i=0;i<w;i++)for(let j=0;j<h;j++){tile(a+i,b+j,(i+j)%2?'#d7ad3d':'#e3bd4a');let p=iso(a+i,b+j);for(let k=0;k<7;k++){let xx=p.x-25+k*8,yy=p.y-8+((k*3)%9);q.strokeStyle='#f2d66a';q.lineWidth=2;q.beginPath();q.moveTo(xx,yy+12);q.lineTo(xx,yy-5);q.stroke()}}}
function road(a,b,len,dir){for(let i=0;i<len;i++){let aa=a+(dir===0?i:0),bb=b+(dir===1?i:0);tile(aa,bb,'#b99a6a');let p=iso(aa,bb);q.fillStyle='#755f4055';for(let k=0;k<5;k++){q.beginPath();q.arc(p.x-20+k*10,p.y+(k%2?3:-3),1.5,0,7);q.fill()}}}
function draw(){q.setTransform(dpr,0,0,dpr,0,0);let g=q.createLinearGradient(0,0,0,H);g.addColorStop(0,'#9bc7d7');g.addColorStop(.32,'#789d55');g.addColorStop(1,'#426a3c');q.fillStyle=g;q.fillRect(0,0,W,H);q.save();q.translate(W/2+camX,H*.12+camY);q.scale(zoom,zoom);q.translate(-OX,-OY);
for(let a=0;a<29;a++)for(let b=0;b<22;b++){let water=(a>22&&b>11)||(a>25&&b>8);tile(a,b,water?((a+b)%2?'#3d91ad':'#4ba0b8'):((a+b)%3?'#79a956':'#72a050'))}
for(let a=23;a<29;a++)for(let b=11;b<22;b++){let p=iso(a,b);q.strokeStyle='#b9e6e566';q.beginPath();q.moveTo(p.x-24,p.y);q.quadraticCurveTo(p.x,p.y-6,p.x+23,p.y);q.stroke()}
road(4,8,15,0);road(9,3,14,1);road(3,13,17,0);field(14,4,5,5);
for(let i=0;i<75;i++){let a=1+rnd(i,2)*27,b=1+rnd(i,9)*20;if(!((a>12&&a<21&&b>2&&b<15)||(a>22&&b>10)))tree(a,b,.65+rnd(i,5)*.45)}
for(let i=0;i<28;i++)rock(1+rnd(i,4)*27,1+rnd(i,7)*20,.6+rnd(i,3)*.6);
house(9,8,1.15);barn(12,6);house(8,12,.8,'#8d4937');house(16,12,.8,'#9c5539');house(5,10,.75,'#704434');
let p=iso(18,8);q.fillStyle='#eee1bb';q.fillRect(p.x-25,p.y-75,50,70);poly([{x:p.x-31,y:p.y-72},{x:p.x,y:p.y-103},{x:p.x+31,y:p.y-72}],'#7a4734');q.fillStyle='#6c5135';q.fillRect(p.x-4,p.y-128,8,62);q.strokeStyle='#e2d0a6';q.lineWidth=5;for(let ang=0;ang<6.2;ang+=Math.PI/2){q.beginPath();q.moveTo(p.x,p.y-100);q.lineTo(p.x+Math.cos(ang)*42,p.y-100+Math.sin(ang)*42);q.stroke()}
for(let i=0;i<22;i++){let a=5+rnd(i,1)*15,b=5+rnd(i,6)*10,p=iso(a,b);q.fillStyle='#d8b07a';q.beginPath();q.arc(p.x,p.y-13,4,0,7);q.fill();q.fillStyle=i%2?'#315f8b':'#8c4937';q.fillRect(p.x-4,p.y-9,8,12)}
q.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);
let pts=new Map(),lastDist=0,lastMid=null;c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY})};c.onpointermove=e=>{if(!pts.has(e.pointerId))return;let old=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});let ar=[...pts.values()];if(ar.length===1){camX+=e.clientX-old.x;camY+=e.clientY-old.y}else{let d=Math.hypot(ar[0].x-ar[1].x,ar[0].y-ar[1].y);if(lastDist)zoom=Math.max(.55,Math.min(1.8,zoom*d/lastDist));lastDist=d}};function up(e){pts.delete(e.pointerId);lastDist=0}c.onpointerup=up;c.onpointercancel=up;
</script></body></html>
