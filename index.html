      ctx.setTransform(D,0,0,D,0,0);ctx.fillStyle='#152014';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);ctx.scale(camera.zoom,camera.zoom);ctx.translate(-camera.x,-camera.y);ctx.drawImage(images.map,0,0,1536,1024);
      const moving=Math.hypot(player.vx,player.vy)>8,frame=moving?Math.floor(anim*7)%3:1,objects=[];
      if(player.mode!=='tractor')objects.push({y:tractor.y,draw:()=>{shadow(tractor.x,tractor.y,37);sheet(images.tractor,tractor.dir,1,tractor.x,tractor.y,130)}});
      objects.push({y:trailer.y,draw:()=>{shadow(trailer.x,trailer.y,31);sheet(images.trailer,trailer.dir,trailer.attached?frame:1,trailer.x,trailer.y,116)}});
      objects.push({y:player.y+.1,draw:()=>{if(player.mode==='tractor'){shadow(player.x,player.y,37);const h=sheet(images.tractor,player.dir,frame,player.x,player.y,130);diamond(player.x,player.y,profile.diamond,h)}else{shadow(player.x,player.y,11);const h=sheet(images.farmer,player.dir,frame,player.x,player.y,72);diamond(player.x,player.y,profile.diamond,h)}}});
      objects.sort((a,b)=>a.y-b.y).forEach(o=>o.draw());ctx.restore();
    }
    function pointSegment(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/l)):0;return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}
    function pointInPoly(x,y,p){let inside=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))inside=!inside}return inside}
    function circlePoly(x,y,r,p){if(pointInPoly(x,y,p))return true;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];if(pointSegment(x,y,a[0],a[1],b[0],b[1])<r)return true}return false}
    function inPolys(x,y,polys){return polys.some(p=>pointInPoly(x,y,p))}
    function isRoadAt(x,y){if(inPolys(x,y,plazaPolys))return true;if(roads.some(s=>pointSegment(x,y,s[0],s[1],s[2],s[3])<s[4]))return true;return sampledTerrain(x,y)==='road'}
    function isWaterAt(x,y){if(inPolys(x,y,bridgePolys))return false;return inPolys(x,y,waterPolys)||sampledTerrain(x,y)==='water'}
    function isForestAt(x,y){if(isRoadAt(x,y))return false;return inPolys(x,y,forestPolys)||forestCircles.some(c=>Math.hypot(x-c.x,y-c.y)<c.r)||sampledTerrain(x,y)==='forest'}
    function isRoughAt(x,y){if(isRoadAt(x,y))return false;return rockCircles.some(c=>Math.hypot(x-c.x,y-c.y)<c.r)||sampledTerrain(x,y)==='rough'}
    function terrainAt(x,y){if(isWaterAt(x,y))return'water';if(isRoadAt(x,y))return'road';if(inPolys(x,y,fieldPolys)||sampledTerrain(x,y)==='field')return'field';if(isForestAt(x,y))return'forest';if(isRoughAt(x,y))return'rough';return'meadow'}
    function terrainSpeed(mode,terrain){if(mode==='tractor')return terrain==='road'?2:terrain==='field'?1.5:1;return terrain==='road'?1:(terrain==='forest'||terrain==='rough')?.3:.7}
    function canStand(x,y,r,mode=player.mode){
      if(x<25+r||x>1511-r||y<35+r||y>995-r)return false;
      const samples=[[0,0],[r,0],[-r,0],[0,r],[0,-r]],onRoad=isRoadAt(x,y),onBridge=inPolys(x,y,bridgePolys);if(samples.some(([dx,dy])=>isWaterAt(x+dx,y+dy))&&!(onRoad&&onBridge))return false;
      for(const p of solidPolys)if(circlePoly(x,y,r,p))return false;
      for(const c of solidCircles)if(Math.hypot(x-c.x,y-c.y)<r+c.r)return false;
      if(mode==='tractor'&&!isRoadAt(x,y))for(const c of rockCircles)if(Math.hypot(x-c.x,y-c.y)<r+c.r)return false;
      for(const f of fences)if(pointSegment(x,y,...f)<r+2&&!isRoadAt(x,y))return false;
      if(mode==='tractor'){
        if(!onRoad&&samples.some(([dx,dy])=>isForestAt(x+dx,y+dy)||isRoughAt(x+dx,y+dy)))return false;
        for(const f of tractorBarriers)if(pointSegment(x,y,...f)<r+2)return false;
      }
      return true;
    }
    function movePlayer(dx,dy){const r=player.mode==='tractor'?25:7,ox=player.x,oy=player.y,trapped=!canStand(ox,oy,r);let nx=player.x+dx,ny=player.y;if(trapped||canStand(nx,ny,r))player.x=nx;else player.vx=0;nx=player.x;ny=player.y+dy;if(trapped||canStand(nx,ny,r))player.y=ny;else player.vy=0;if(player.x===ox&&player.y===oy&&Math.abs(dx)+Math.abs(dy)>0&&performance.now()-blockedAt>650){blockedAt=performance.now();desc.textContent=player.mode==='tractor'?'For trangt eller ulendt for traktoren':'Her er veien sperret'}return player.x!==ox||player.y!==oy}
    function distance(a,b){return Math.hypot(player.x-a,player.y-b)}
    function updateActions(){let list=[];if(player.mode==='walk'&&distance(tractor.x,tractor.y)<108)list.push(['enter','🚜 Kjør traktoren']);if(player.mode==='tractor'){list.push(['exit','🚶 Gå ut av traktoren']);if(!trailer.attached&&distance(trailer.x,trailer.y)<125)list.push(['attach','🔗 Koble til tilhenger']);if(trailer.attached)list.push(['detach','⛓️ Koble fra tilhenger'])}const box=document.getElementById('contextActions'),sig=list.map(x=>x[0]).join('|');if(box.dataset.sig!==sig){box.dataset.sig=sig;box.innerHTML='';list.forEach(([id,text])=>{const b=document.createElement('button');b.textContent=text;b.onclick=()=>act(id);box.appendChild(b)})}}
    function safeExit(){for(const [dx,dy] of [[48,20],[-48,20],[0,55],[0,-55]])if(canStand(player.x+dx,player.y+dy,7,'walk'))return [player.x+dx,player.y+dy];return [player.x,player.y]}
    function act(id){
      if(id==='enter'){player.mode='tractor';player.x=tractor.x;player.y=tractor.y;player.dir=tractor.dir;player.vx=player.vy=0;lastTerrain='';place.textContent=profile.name;desc.textContent='Du kjører traktoren'}
      if(id==='exit'){tractor.x=player.x;tractor.y=player.y;tractor.dir=player.dir;const p=safeExit();player.mode='walk';player.x=p[0];player.y=p[1];player.vx=player.vy=0;lastTerrain='';place.textContent=profile.name;desc.textContent='Traktoren er parkert'}
      if(id==='attach'){const v=directionVector(player.dir);trailer.attached=true;trailer.dir=player.dir;trailPath.length=0;for(let i=0;i<32;i++)trailPath.push({x:player.x-v[0]*i*6,y:player.y-v[1]*i*6,dir:player.dir});trailer.x=player.x-v[0]*88;trailer.y=player.y-v[1]*88;desc.textContent='Tilhengeren er koblet til draget'}
      if(id==='detach'){trailer.attached=false;trailPath.length=0;desc.textContent='Tilhengeren er parkert'}center();updateActions()
    }
    function followTrailer(){if(!trailer.attached)return;const newest=trailPath[0];if(!newest||Math.hypot(player.x-newest.x,player.y-newest.y)>2)trailPath.unshift({x:player.x,y:player.y,dir:player.dir});let travelled=0,pick=trailPath[trailPath.length-1],ahead=trailPath[Math.max(0,trailPath.length-2)];for(let i=1;i<trailPath.length;i++){travelled+=Math.hypot(trailPath[i].x-trailPath[i-1].x,trailPath[i].y-trailPath[i-1].y);if(travelled>=88){pick=trailPath[i];ahead=trailPath[i-1];trailPath.length=Math.min(trailPath.length,i+24);break}}trailer.x=pick.x;trailer.y=pick.y;trailer.dir=directionFor(ahead.x-pick.x,ahead.y-pick.y,trailer.dir);if(trailPath.length>110)trailPath.length=110}
    function update(t){
      const dt=Math.min((t-last||16)/1000,.05);last=t;anim+=dt;let x=move.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),y=move.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),m=Math.hypot(x,y);if(m>1){x/=m;y/=m}
      const terrain=terrainAt(player.x,player.y),mult=terrainSpeed(player.mode,terrain),top=105*mult,quick=player.mode==='tractor'?4.5:10,targetX=x*top,targetY=y*top,k=Math.min(1,dt*quick);player.vx+=(targetX-player.vx)*k;player.vy+=(targetY-player.vy)*k;if(m<.05&&Math.hypot(player.vx,player.vy)<2)player.vx=player.vy=0;
      if(m>.05&&terrain!==lastTerrain){lastTerrain=terrain;const names={road:'Vei',field:'Jorde',meadow:'Eng',forest:'Skog',rough:'Steinur',water:'Vann'};place.textContent=`${profile.name} · ${names[terrain]}`;desc.textContent=player.mode==='tractor'?`${mult.toLocaleString('nb-NO')}× kjørehastighet`:`${mult.toLocaleString('nb-NO')}× ganghastighet`}
      const moved=movePlayer(player.vx*dt,player.vy*dt);if(moved){player.dir=directionFor(player.vx,player.vy,player.dir);if(player.mode==='tractor'){tractor.x=player.x;tractor.y=player.y;tractor.dir=player.dir;followTrailer()}center()}
      updateActions();render();requestAnimationFrame(update)
    }
    const stick=document.getElementById('stick'),knob=document.getElementById('knob');function steer(e){const r=stick.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=28,m=Math.hypot(x,y);if(m>l){x=x/m*l;y=y/m*l}knob.style.transform=`translate(${x}px,${y}px)`;move.x=x/l;move.y=y/l}stick.onpointerdown=e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);steer(e)};stick.onpointermove=e=>{if(e.pointerId===stickId)steer(e)};function stopStick(e){if(e.pointerId!==stickId)return;stickId=null;move.x=move.y=0;knob.style.transform='translate(0,0)'}stick.onpointerup=stopStick;stick.onpointercancel=stopStick;
    canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY})};canvas.onpointermove=e=>{if(!touches.has(e.pointerId))return;const old=touches.get(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=[...touches.values()];if(p.length===1){camera.x-=(e.clientX-old.x)/camera.zoom;camera.y-=(e.clientY-old.y)/camera.zoom}else{const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch)camera.zoom=Math.max(.45,Math.min(2.5,camera.zoom*d/pinch));pinch=d}};function release(e){touches.delete(e.pointerId);pinch=0}canvas.onpointerup=release;canvas.onpointercancel=release;canvas.onwheel=e=>{camera.zoom=Math.max(.45,Math.min(2.5,camera.zoom*(e.deltaY>0?.9:1.1)));e.preventDefault()};
    addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){keys[e.key]=true;e.preventDefault()}});addEventListener('keyup',e=>{keys[e.key]=false});
    const modal=document.getElementById('profileModal'),nameInput=document.getElementById('playerName'),swatches=document.getElementById('swatches'),hudName=document.getElementById('hudName');let chosen=profile.diamond;colors.forEach(c=>{const b=document.createElement('button');b.className='swatch';b.style.background=c;b.onclick=()=>{chosen=c;document.querySelectorAll('.swatch').forEach(q=>q.classList.toggle('chosen',q===b))};swatches.appendChild(b)});function openProfile(){nameInput.value=profile.name;chosen=profile.diamond;document.querySelectorAll('.swatch').forEach((q,i)=>q.classList.toggle('chosen',colors[i]===chosen));modal.classList.add('open');setTimeout(()=>nameInput.focus(),50)}function closeProfile(){modal.classList.remove('open')}document.getElementById('openProfile').onclick=openProfile;document.getElementById('cancelProfile').onclick=closeProfile;document.getElementById('saveProfile').onclick=()=>{profile={name:nameInput.value.trim()||'Gårdbrukeren',diamond:chosen};try{localStorage.setItem('lilleGaardslivProfile',JSON.stringify(profile))}catch(e){}hudName.textContent=profile.name;place.textContent=profile.name;closeProfile()};modal.onclick=e=>{if(e.target===modal)closeProfile()};
    hudName.textContent=profile.name;document.getElementById('coins').textContent=gameState.coins.toLocaleString('nb-NO');document.getElementById('eggs').textContent=gameState.eggs||0;document.getElementById('grain').textContent=gameState.grain||0;
    Promise.all(Object.entries(sources).map(([k,u])=>loadImage(k,u))).then(()=>{document.getElementById('loading').classList.add('hidden');center();requestAnimationFrame(update)}).catch(()=>{document.getElementById('loading').textContent='Kunne ikke laste grafikken. Prøv å åpne siden på nytt.'});
  </script>
