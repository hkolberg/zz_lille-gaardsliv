name: Build Godot web test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/build-godot-web.yml"

permissions:
  contents: write

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import project
        run: godot --headless --editor --path godot --quit

      - name: Export web build
        run: |
          mkdir -p godot-test
          godot --headless --path godot --export-release Web ../godot-test/index.html
          touch godot-test/.nojekyll

      - name: Commit generated test version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f godot-test
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build Godot web test [skip ci]"
          git push
