function updatePlayer(t){let dt=Math.min((t-lastFrame||16)/1000,.05);lastFrame=t;let x=move.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),y=move.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);let m=Math.hypot(x,y);if(m>1){x/=m;y/=m}if(m){let speed=profileData.vehicle==='tractor'?2.2:profileData.vehicle==='horse'?1.75:1.25,na=Math.max(.5,Math.min(N-1.5,player.a+(y*.75+x)*speed*dt)),nb=Math.max(.5,Math.min(M-1.5,player.b+(y*.75-x)*speed*dt));if(!water(na,nb)){player.a=na;player.b=nb}label.textContent=profileData.name;desc.textContent=profileData.vehicle==='tractor'?'Du kjører den røde traktoren':profileData.vehicle==='horse'?'Du rir på hesten':'Du går til fots'}}function waterTile(a,b,t){let p=iso(a,b);diamond(a,b,(a+b)%2?'#3e8ea8':'#4599b0',0);X.strokeStyle='#b6e5df66';X.beginPath();X.moveTo(p.x-22+(t/1200+a+b)%1*5,p.y);X.quadraticCurveTo(p.x,p.y-5,p.x+22,p.y);X.stroke()}

const hits=[{a:7,b:8,n:'Rønningsberg gård',d:'Våningshus · 5 beboere · nivå 2'},{a:12,b:5,n:'Den røde låven',d:'Lagrer korn, høy og redskaper'},{a:19,b:8,n:'Solvang mølle',d:'Maler 12 sekker korn hver dag'},{a:11,b:10,n:'Landsbybrønnen',d:'Friskt vann til hele bygda'}];function screen(a,b){let p=iso(a,b,height(a,b));return{x:(p.x-OX)*cam.z+W/2+cam.x,y:(p.y-OY)*cam.z+H*.06+cam.y}}C.onpointerdown=e=>{C.setPointerCapture(e.pointerId);touch.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false};C.onpointermove=e=>{if(!touch.has(e.pointerId))return;let old=touch.get(e.pointerId);touch.set(e.pointerId,{x:e.clientX,y:e.clientY});let a=[...touch.values()];if(a.length===1){let dx=e.clientX-old.x,dy=e.clientY-old.y;cam.x+=dx;cam.y+=dy;if(Math.abs(dx)+Math.abs(dy)>3)moved=true}else{let d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)cam.z=Math.max(.55,Math.min(1.75,cam.z*d/pinch));pinch=d;moved=true}};function up(e){let p=touch.get(e.pointerId);touch.delete(e.pointerId);pinch=0;if(!moved&&p){let best=null,dist=55;for(const h of hits){let s=screen(h.a,h.b),d=Math.hypot(p.x-s.x,p.y-s.y+30);if(d<dist){dist=d;best=h}}if(best){label.textContent=best.n;desc.textContent=best.d}}}C.onpointerup=up;C.onpointercancel=up;document.querySelectorAll('.tools button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tools button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickId=null;function steer(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=Math.hypot(x,y),limit=27;if(m>limit){x=x/m*limit;y=y/m*limit}knob.style.transform=`translate(${x}px,${y}px)`;move.x=x/limit;move.y=y/limit}stick.onpointerdown=e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);steer(e)};stick.onpointermove=e=>{if(e.pointerId===stickId)steer(e)};function stopStick(e){if(e.pointerId!==stickId)return;stickId=null;move.x=move.y=0;knob.style.transform='translate(0,0)'}stick.onpointerup=stopStick;stick.onpointercancel=stopStick;
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){keys[e.key]=true;e.preventDefault()}});addEventListener('keyup',e=>{keys[e.key]=false});
const modal=document.getElementById('profile'),nameInput=document.getElementById('playerName'),shirtInput=document.getElementById('shirt'),vehicleInput=document.getElementById('vehicle'),swatches=document.getElementById('diamondColors'),hudName=document.getElementById('hudName');let chosenColor=profileData.diamond;colors.forEach(c=>{let b=document.createElement('button');b.className='swatch';b.style.background=c;b.setAttribute('aria-label','Velg '+c);b.onclick=()=>{chosenColor=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('chosen',x===b))};swatches.appendChild(b)});function loadProfileForm(){nameInput.value=profileData.name;shirtInput.value=profileData.shirt;vehicleInput.value=profileData.vehicle;chosenColor=profileData.diamond;document.querySelectorAll('.swatch').forEach((x,i)=>x.classList.toggle('chosen',colors[i]===chosenColor))}function openProfile(){loadProfileForm();modal.classList.add('open')}function closeProfile(){modal.classList.remove('open')}document.getElementById('openProfile').onclick=openProfile;document.getElementById('cancelProfile').onclick=closeProfile;document.getElementById('saveProfile').onclick=()=>{profileData={name:nameInput.value.trim()||'Gårdbrukeren',diamond:chosenColor,shirt:shirtInput.value,vehicle:vehicleInput.value};try{localStorage.setItem('lilleGaardslivProfile',JSON.stringify(profileData))}catch(e){}hudName.textContent=profileData.name;label.textContent=profileData.name;desc.textContent='Profilen er lagret på denne enheten';closeProfile()};modal.onclick=e=>{if(e.target===modal)closeProfile()};hudName.textContent=profileData.name;if(!localStorage.getItem('lilleGaardslivProfile'))setTimeout(openProfile,350);
</script></body></html>
