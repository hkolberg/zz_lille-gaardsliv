function well(a,b){let p=iso(a,b,height(a,b));shadow(p,23,8);X.fillStyle='#77776d';X.beginPath();X.ellipse(p.x,p.y,20,10,0,0,7);X.fill();X.fillStyle='#282f2a';X.beginPath();X.ellipse(p.x,p.y-3,13,6,0,0,7);X.fill();X.strokeStyle='#523720';X.lineWidth=4;X.beginPath();X.moveTo(p.x-15,p.y-4);X.lineTo(p.x-15,p.y-34);X.moveTo(p.x+15,p.y-4);X.lineTo(p.x+15,p.y-34);X.stroke();path([{x:p.x-23,y:p.y-32},{x:p.x,y:p.y-44},{x:p.x+23,y:p.y-32}],'#88422f','#4d2e20',2)}function villager(a,b,i,t){let p=iso(a,b,height(a,b));p.x+=Math.sin(t/1800+i*2)*7;p.y+=Math.sin(t/350+i)*1.5;X.fillStyle='#1d251a44';X.fillRect(p.x-5,p.y+1,11,4);X.fillStyle='#d2a36e';X.fillRect(p.x-3,p.y-18,7,7);X.fillStyle=['#315e82','#873f35','#d09a37','#496c36'][i%4];X.fillRect(p.x-5,p.y-11,10,11);X.fillStyle='#493426';X.fillRect(p.x-4,p.y-20,8,3)}
function controlled(a,b,t){let p=iso(a,b,height(a,b)),top=p.y-40;if(player.mode==='tractor'){tractorSprite(a,b);top=p.y-47}else{shadow(p,10,6);X.fillStyle='#d2a36e';X.fillRect(p.x-4,p.y-25,8,8);X.fillStyle=profileData.shirt;X.fillRect(p.x-6,p.y-17,12,14);X.fillStyle='#493426';X.fillRect(p.x-5,p.y-28,10,4)}let bob=Math.sin(t/280)*2;path([{x:p.x,y:top-17+bob},{x:p.x+9,y:top-8+bob},{x:p.x,y:top+1+bob},{x:p.x-9,y:top-8+bob}],profileData.diamond,'#fff7d8',2)}
function updatePlayer(t){if(game.field==='growing'&&Date.now()>=game.readyAt)game.field='ripe';let dt=Math.min((t-lastFrame||16)/1000,.05);lastFrame=t;let x=move.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),y=move.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),m=Math.hypot(x,y);if(m>1){x/=m;y/=m}if(m){let speed=player.mode==='tractor'?2.2:1.25,na=Math.max(.5,Math.min(N-1.5,player.a+(y*.75+x)*speed*dt)),nb=Math.max(.5,Math.min(M-1.5,player.b+(y*.75-x)*speed*dt));if(!water(na,nb)){player.a=na;player.b=nb;if(player.mode==='tractor'){tractor.a=na;tractor.b=nb;if(trailer.attached){trailer.a=na-.75;trailer.b=nb+.65}}}centerCamera()}updateContext()}function centerCamera(){let p=iso(player.a,player.b,height(player.a,player.b));cam.x=-(p.x-OX)*cam.z;cam.y=H*.5-H*.06-(p.y-OY)*cam.z}function waterTile(a,b,t){let p=iso(a,b);diamond(a,b,(a+b)%2?'#3e8ea8':'#4599b0',0);X.strokeStyle='#b6e5df66';X.beginPath();X.moveTo(p.x-22+(t/1200+a+b)%1*5,p.y);X.quadraticCurveTo(p.x,p.y-5,p.x+22,p.y);X.stroke()}
function draw(t){updatePlayer(t);X.setTransform(D,0,0,D,0,0);let sky=X.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#9ccad6');sky.addColorStop(.28,'#9bbf72');sky.addColorStop(1,'#365b35');X.fillStyle=sky;X.fillRect(0,0,W,H);X.save();X.translate(W/2+cam.x,H*.06+cam.y);X.scale(cam.z,cam.z);X.translate(-OX,-OY);for(let s=0;s<N+M;s++)for(let a=0;a<N;a++){let b=s-a;if(b<0||b>=M)continue;if(water(a,b))waterTile(a,b,t);else if((b===10&&a>3&&a<23)||(a===10&&b>5&&b<19)||(b===15&&a>8&&a<21))road(a,b);else if(a>=14&&a<=19&&b>=5&&b<=9)field(a,b);else grass(a,b)}let o=[];for(let i=0;i<62;i++){let a=.6+hash(i,2)*25,b=.6+hash(i,8)*21;if(!water(a,b)&&!((a>5&&a<22)&&(b>4&&b<18)))o.push({d:a+b,f:()=>tree(a,b,.62+hash(i,4)*.35)})}for(let i=0;i<20;i++){let a=1+hash(i,5)*24,b=1+hash(i,11)*20;if(!water(a,b)&&!(a>6&&a<21&&b>5&&b<17))o.push({d:a+b,f:()=>rock(a,b,.55+hash(i,1)*.5)})}o.push({d:15,f:()=>farmhouse(7,8)},{d:15.1,f:()=>chimneySmoke(7,8,t)},{d:17,f:()=>barn(12,5)},{d:19,f:()=>cottage(7,12)},{d:23,f:()=>cottage(13,10,'#9b5035')},{d:27,f:()=>cottage(11,16,'#754331')},{d:27,f:()=>mill(19,8,t)},{d:21,f:()=>well(11,10)},{d:25,f:()=>chickenCoop(9,16)},{d:35,f:()=>market(21,14)},{d:18.2,f:()=>haystack(12.7,5.5)},{d:16.5,f:()=>woodpile(8.2,8.3)},{d:20,f:()=>flag(10,10,'#e4513a')},{d:25,f:()=>flag(10,15,'#e5b93f')},{d:26,f:()=>flag(16,10,'#4b79c4')},{d:36,f:()=>flag(21,15,'#d84b39')});for(let i=0;i<5;i++){let a=5.5+i*.65,b=15.2+(i%2)*.6;o.push({d:a+b,f:()=>sheep(a,b,i)})}for(let i=0;i<14;i++){let a=6+hash(i,15)*13,b=7+hash(i,20)*9;o.push({d:a+b+.5,f:()=>villager(a,b,i,t)})}if(player.mode!=='tractor')o.push({d:tractor.a+tractor.b,f:()=>tractorSprite(tractor.a,tractor.b)});o.push({d:trailer.a+trailer.b,f:()=>trailerSprite(trailer.a,trailer.b,game.grain>0)});o.push({d:player.a+player.b+.7,f:()=>controlled(player.a,player.b,t)});o.sort((a,b)=>a.d-b.d).forEach(v=>v.f());X.restore();requestAnimationFrame(draw)}requestAnimationFrame(draw);
function distance(a,b){return Math.hypot(player.a-a,player.b-b)}function saveGame(){try{localStorage.setItem('lilleGaardslivGame',JSON.stringify(game))}catch(e){}}function message(title,text){label.textContent=title;desc.textContent=text}function updateHud(){document.getElementById('coins').textContent=game.coins.toLocaleString('nb-NO');document.getElementById('eggs').textContent=game.eggs;document.getElementById('grain').textContent=game.grain;let loads=[];if(game.eggs)loads.push(`${game.eggs} egg i kurven`);if(game.grain)loads.push(`${game.grain} korn i tilhengeren`);document.getElementById('cargo').textContent=(player.mode==='tractor'?'Traktor':'Til fots')+(trailer.attached?' + tilhenger':'')+' · '+(loads.join(' · ')||'ingen last')}
function updateContext(){let actions=[],trailerAtMarket=Math.hypot(trailer.a-21,trailer.b-14)<2,saleValue=game.eggs*8+(trailerAtMarket?game.grain*3:0);if(player.mode==='walk'&&distance(tractor.a,tractor.b)<1.35)actions.push(['enter','🚜 Kjør traktoren']);if(player.mode==='tractor'){actions.push(['exit','🚶 Gå ut av traktoren']);if(!trailer.attached&&distance(trailer.a,trailer.b)<1.55)actions.push(['attach','🔗 Koble til tilhenger']);if(trailer.attached)actions.push(['detach','⛓️ Koble fra tilhenger']);if(player.a>=13.2&&player.a<=20.5&&player.b>=4.2&&player.b<=10.5){if(game.field==='ripe')actions.push(['harvest','🌾 Høst korn']);else if(game.field==='fallow')actions.push(['sow','🌱 Så korn'])}}if(player.mode==='walk'&&distance(9,16)<1.55)actions.push(['eggs','🥚 Sank egg']);if(distance(21,14)<1.8&&saleValue)actions.push(['sell',`🪙 Selg varer · ${saleValue} mynter`]);let sig=actions.map(a=>a[0]+a[1]).join('|')+'-'+player.mode+'-'+trailer.attached+'-'+game.field;if(sig!==lastContext){lastContext=sig;let box=document.getElementById('contextActions');box.innerHTML='';actions.slice(0,3).forEach(([id,text])=>{let b=document.createElement('button');b.textContent=text;b.onclick=()=>perform(id);box.appendChild(b)})}updateHud()}
function showSale(earned,eggCount,grainCount){let parts=[];if(eggCount)parts.push(`${eggCount} egg × 8 = ${eggCount*8}`);if(grainCount)parts.push(`${grainCount} korn × 3 = ${grainCount*3}`);let toast=document.getElementById('saleToast');toast.innerHTML=`<strong>+${earned} mynter</strong><span>${parts.join(' &nbsp;+&nbsp; ')}</span>`;toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');let resources=document.getElementById('resources');resources.classList.remove('flash');void resources.offsetWidth;resources.classList.add('flash')}
function perform(id){if(id==='enter'){player.mode='tractor';player.a=tractor.a;player.b=tractor.b;message(profileData.name,'Du kjører traktoren')}else if(id==='exit'){tractor.a=player.a;tractor.b=player.b;player.mode='walk';player.a+=.45;player.b+=.35;message(profileData.name,'Traktoren er parkert her')}else if(id==='attach'){trailer.attached=true;message('Tilhenger koblet til','Nå kan du høste og frakte korn')}else if(id==='detach'){trailer.attached=false;trailer.a=player.a-.8;trailer.b=player.b+.7;message('Tilhenger parkert','Du kan hente den igjen senere')}else if(id==='harvest'){if(!trailer.attached){message('Du trenger tilhengeren','Kjør tilbake og koble den til traktoren')}else{game.grain+=40;game.field='fallow';message('Kornet er høstet','40 sekker ligger i tilhengeren')}}else if(id==='sow'){game.field='growing';game.readyAt=Date.now()+15000;message('Jordet er sådd','Kornet modnes om litt og blir stående modent')}else if(id==='eggs'){let now=Date.now();if(now<(game.nextEggsAt||0))message('Ingen nye egg ennå','Hønene trenger litt mer tid');else{game.eggs+=6;game.nextEggsAt=now+15000;message('Egg sanket','Du fant 6 ferske egg')}}else if(id==='sell'){let trailerAtMarket=Math.hypot(trailer.a-21,trailer.b-14)<2,eggCount=game.eggs,grainCount=trailerAtMarket?game.grain:0,earned=eggCount*8+grainCount*3;game.coins+=earned;game.eggs=0;game.grain-=grainCount;message('Varene er solgt',`${eggCount} egg og ${grainCount} korn ga ${earned} mynter`);showSale(earned,eggCount,grainCount)}saveGame();lastContext='';updateContext()}
const hits=[{a:7,b:8,n:'Rønningsberg gård',d:'Våningshus · 5 beboere · nivå 2'},{a:12,b:5,n:'Den røde låven',d:'Lagrer korn, høy og redskaper'},{a:19,b:8,n:'Solvang mølle',d:'Maler 12 sekker korn hver dag'},{a:11,b:10,n:'Landsbybrønnen',d:'Friskt vann til hele bygda'},{a:9,b:16,n:'Hønsehuset',d:'Gå hit til fots for å sanke egg'},{a:21,b:14,n:'Torget',d:'Selg egg og korn i småbyen'}];function screen(a,b){let p=iso(a,b,height(a,b));return{x:(p.x-OX)*cam.z+W/2+cam.x,y:(p.y-OY)*cam.z+H*.06+cam.y}}C.onpointerdown=e=>{C.setPointerCapture(e.pointerId);touch.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false};C.onpointermove=e=>{if(!touch.has(e.pointerId))return;let old=touch.get(e.pointerId);touch.set(e.pointerId,{x:e.clientX,y:e.clientY});let a=[...touch.values()];if(a.length===1){let dx=e.clientX-old.x,dy=e.clientY-old.y;cam.x+=dx;cam.y+=dy;if(Math.abs(dx)+Math.abs(dy)>3)moved=true}else{let d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)cam.z=Math.max(.55,Math.min(1.75,cam.z*d/pinch));pinch=d;moved=true}};function up(e){let p=touch.get(e.pointerId);touch.delete(e.pointerId);pinch=0;if(!moved&&p){let best=null,dist=55;for(const h of hits){let s=screen(h.a,h.b),d=Math.hypot(p.x-s.x,p.y-s.y+30);if(d<dist){dist=d;best=h}}if(best){label.textContent=best.n;desc.textContent=best.d}}}C.onpointerup=up;C.onpointercancel=up;
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickId=null;function steer(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=Math.hypot(x,y),limit=27;if(m>limit){x=x/m*limit;y=y/m*limit}knob.style.transform=`translate(${x}px,${y}px)`;move.x=x/limit;move.y=y/limit}stick.onpointerdown=e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);steer(e)};stick.onpointermove=e=>{if(e.pointerId===stickId)steer(e)};function stopStick(e){if(e.pointerId!==stickId)return;stickId=null;move.x=move.y=0;knob.style.transform='translate(0,0)'}stick.onpointerup=stopStick;stick.onpointercancel=stopStick;
addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea')||modal.classList.contains('open'))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){keys[e.key]=true;e.preventDefault()}});addEventListener('keyup',e=>{if(!e.target.matches('input,select,textarea'))keys[e.key]=false});
const modal=document.getElementById('profile'),nameInput=document.getElementById('playerName'),shirtInput=document.getElementById('shirt'),swatches=document.getElementById('diamondColors'),hudName=document.getElementById('hudName');let chosenColor=profileData.diamond;colors.forEach(c=>{let b=document.createElement('button');b.className='swatch';b.style.background=c;b.setAttribute('aria-label','Velg '+c);b.onclick=()=>{chosenColor=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('chosen',x===b))};swatches.appendChild(b)});function loadProfileForm(){nameInput.value=profileData.name;shirtInput.value=profileData.shirt;chosenColor=profileData.diamond;document.querySelectorAll('.swatch').forEach((x,i)=>x.classList.toggle('chosen',colors[i]===chosenColor))}function openProfile(){keys={};loadProfileForm();modal.classList.add('open');setTimeout(()=>nameInput.focus(),50)}function closeProfile(){modal.classList.remove('open')}document.getElementById('openProfile').onclick=openProfile;document.getElementById('cancelProfile').onclick=closeProfile;document.getElementById('saveProfile').onclick=()=>{profileData={name:nameInput.value.trim()||'Gårdbrukeren',diamond:chosenColor,shirt:shirtInput.value};try{localStorage.setItem('lilleGaardslivProfile',JSON.stringify(profileData))}catch(e){}hudName.textContent=profileData.name;message(profileData.name,'Profilen er lagret på denne enheten');closeProfile()};modal.onclick=e=>{if(e.target===modal)closeProfile()};hudName.textContent=profileData.name;let hasProfile=true;try{hasProfile=!!localStorage.getItem('lilleGaardslivProfile')}catch(e){}if(!hasProfile)setTimeout(openProfile,350);centerCamera();updateHud();updateContext();
